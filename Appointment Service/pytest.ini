[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
pythonpath = . ..
testpaths = tests
norecursedirs = .git .venv __pycache__ graphify-out .pytest_cache
markers =
    integration: marks tests as integration tests (requires live services)
    e2e: marks tests as end-to-end tests (requires all services running)
