name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to production?'
        required: true
        default: 'false'

jobs:
  lint_flake8:
    name: Lint - Flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  lint_gitleaks:
    name: Security - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint_deps:
    name: Lint - Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for safety
        run: |
          pip install safety
          # Check requirements files
          find . -name "requirements*.txt" -exec safety check -r {} + || true

  build_and_push:
    name: Build & Push - ${{ matrix.service.image }}
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [lint_flake8, lint_gitleaks, lint_deps]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - path: "Auth service"
            image: "auth-service"
          - path: "Appointment Service"
            image: "appointment-service"
          - path: "Doctor Service"
            image: "doctor-service"
          - path: "Patient Service"
            image: "patient-service"
          - path: "Notification Service"
            image: "notification-service"
          - path: "AI Service"
            image: "ai-service"
          - path: "Clinical Service"
            image: "clinical-service"
          - path: "EMR Result Service"
            image: "emr-result-service"
          - path: "Payment Service"
            image: "payment-service"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and (optionally) push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service.path }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image }}:latest

  trivy_scan:
    name: Scan - Trivy (${{ matrix.image }})
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push'
    needs: [build_and_push]
    strategy:
      fail-fast: false
      matrix:
        image:
          - auth-service
          - appointment-service
          - doctor-service
          - patient-service
          - notification-service
          - ai-service
          - clinical-service
          - emr-result-service
          - payment-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  deploy:
    name: Deploy (Manual)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [trivy_scan]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_production == 'true'
    environment:
      name: production
    steps:
      - name: Deployment placeholder
        run: echo "Deployment script would run here"
