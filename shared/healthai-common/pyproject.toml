[project]
name = "healthai-common"
version = "0.1.0"
description = "Common utilities for HealthAI services - idempotency, circuit breaker, saga"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.104",
	"uuid-extension",
	"healthai-db",
	"healthai-cache",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
