[project]
name = "healthai-db"
version = "0.1.0"
description = "Shared DB layer for HealthAI services"
requires-python = ">=3.11"
dependencies = [
	"sqlalchemy>=2.0",
	"asyncpg>=0.29",
	"alembic>=1.13",
	"uuid-extension",
	"pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
