[project]
name = "healthai-cache"
version = "0.1.0"
description = "Redis cache layer with distributed locks, stampede protection, and idempotency"
requires-python = ">=3.11"
dependencies = [
	"redis[hiredis]>=5.0",
	"uuid-extension",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
