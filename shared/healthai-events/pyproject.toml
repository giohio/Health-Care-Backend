[project]
name = "healthai-events"
version = "0.1.0"
description = "Event publishing and consuming layer with outbox pattern"
requires-python = ">=3.11"
dependencies = [
	"aio-pika>=9.0",
	"healthai-db",
	"healthai-cache",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
